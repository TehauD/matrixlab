[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastmatrix-chain"
version = "0.1.0"
description = "Reproducible minimum-FLOP dense matrix-chain multiplication research toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Tehau Debarthe"}]
dependencies = ["numpy>=1.26,<3"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Mathematics"
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.2,<5", "ipykernel>=6.29,<7", "matplotlib>=3.8,<4", "pandas>=2.2,<3"]
test = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.8,<1", "mypy>=1.13,<2"]
gpu = ["torch>=2.4,<3"]
all = ["jupyterlab>=4.2,<5", "ipykernel>=6.29,<7", "matplotlib>=3.8,<4", "pandas>=2.2,<3", "pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[project.scripts]
fastmatrix-benchmark = "fastmatrix.benchmark:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["fastmatrix"]

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">MatrixLab and NumPy multi_dot capability comparison</title><desc id="desc">NumPy multi_dot is the numerical reference; MatrixLab adds inspectable plans, cost metadata, backends, and reproducible research workflows.</desc>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1769E0"/><stop offset="1" stop-color="#6D4AFF"/></linearGradient>
  <linearGradient id="good" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#159957"/><stop offset="1" stop-color="#22C55E"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B1F3A" flood-opacity="0.12"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#53657D"/></marker>
  <style>
    text { font-family: Inter, Segoe UI, Arial, sans-serif; fill:#13233A; }
    .h1 { font-size:52px; font-weight:800; letter-spacing:-1px; }
    .h2 { font-size:31px; font-weight:750; }
    .h3 { font-size:23px; font-weight:700; }
    .body { font-size:20px; }
    .small { font-size:16px; fill:#53657D; }
    .mono { font-family: Consolas, Menlo, monospace; font-size:20px; }
    .metric { font-size:64px; font-weight:850; }
  </style>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="800" y="75" class="h1" text-anchor="middle" fill="#0B1F3A" style="fill:#0B1F3A">NumPy multi_dot + MatrixLab</text><text x="800" y="118" class="h3" text-anchor="middle" fill="#53657D" style="fill:#53657D">Reference numerical execution, extended with inspectability and reproducible research tooling.</text><rect x="60" y="165" width="1480" height="650" rx="24" fill="#FFFFFF" stroke="#D7E2F0" stroke-width="2" filter="url(#shadow)"/><rect x="60" y="165" width="650" height="90" rx="24" fill="#F7FAFE" stroke="#D7E2F0" stroke-width="2"/><rect x="710" y="165" width="380" height="90" rx="0" fill="#EAF3FF" stroke="#1769E0" stroke-width="2"/><rect x="1090" y="165" width="450" height="90" rx="24" fill="#F0EDFF" stroke="#6D4AFF" stroke-width="2"/><text x="385" y="222" class="h2" text-anchor="middle" fill="#0B1F3A" style="fill:#0B1F3A">Capability</text><text x="900" y="222" class="h2" text-anchor="middle" fill="#1769E0" style="fill:#1769E0">NumPy multi_dot</text><text x="1315" y="222" class="h2" text-anchor="middle" fill="#6D4AFF" style="fill:#6D4AFF">MatrixLab</text><rect x="61" y="255" width="1478" height="67" fill="#FFFFFF"/><line x1="61" y1="322" x2="1539" y2="322" stroke="#D7E2F0" stroke-width="1"/><text x="95" y="297" class="body" text-anchor="start" fill="#13233A" style="fill:#13233A">Optimized parenthesization</text><text x="900" y="298" class="h3" text-anchor="middle" fill="#159957" style="fill:#159957">YES</text><text x="1315" y="298" class="h3" text-anchor="middle" fill="#159957" style="fill:#159957">YES</text><rect x="61" y="322" width="1478" height="67" fill="#F7FAFE"/><line x1="61" y1="389" x2="1539" y2="389" stroke="#D7E2F0" stroke-width="1"/><text x="95" y="364" class="body" text-anchor="start" fill="#13233A" style="fill:#13233A">Numerical result</text><text x="900" y="365" class="h3" text-anchor="middle" fill="#159957" style="fill:#159957">YES</text><text x="1315" y="365" class="h3" text-anchor="middle" fill="#159957" style="fill:#159957">YES</text><rect x="61" y="389" width="1478" height="67" fill="#FFFFFF"/><line x1="61" y1="456" x2="1539" y2="456" stroke="#D7E2F0" stroke-width="1"/><text x="95" y="431" class="body" text-anchor="start" fill="#13233A" style="fill:#13233A">Inspectable plan object</text><text x="900" y="432" class="h3" text-anchor="middle" fill="#53657D" style="fill:#53657D">—</text><text x="1315" y="432" class="h3" text-anchor="middle" fill="#159957" style="fill:#159957">YES</text><rect x="61" y="456" width="1478" height="67" fill="#F7FAFE"/><line x1="61" y1="523" x2="1539" y2="523" stroke="#D7E2F0" stroke-width="1"/><text x="95" y="498" class="body" text-anchor="start" fill="#13233A" style="fill:#13233A">Parenthesization text</text><text x="900" y="499" class="h3" text-anchor="middle" fill="#53657D" style="fill:#53657D">—</text><text x="1315" y="499" class="h3" text-anchor="middle" fill="#159957" style="fill:#159957">YES</text><rect x="61" y="523" width="1478" height="67" fill="#FFFFFF"/><line x1="61" y1="590" x2="1539" y2="590" stroke="#D7E2F0" stroke-width="1"/><text x="95" y="565" class="body" text-anchor="start" fill="#13233A" style="fill:#13233A">Scalar-count estimate</text><text x="900" y="566" class="h3" text-anchor="middle" fill="#53657D" style="fill:#53657D">—</text><text x="1315" y="566" class="h3" text-anchor="middle" fill="#159957" style="fill:#159957">YES</text><rect x="61" y="590" width="1478" height="67" fill="#F7FAFE"/><line x1="61" y1="657" x2="1539" y2="657" stroke="#D7E2F0" stroke-width="1"/><text x="95" y="632" class="body" text-anchor="start" fill="#13233A" style="fill:#13233A">NumPy + PyTorch CPU/CUDA</text><text x="900" y="633" class="h3" text-anchor="middle" fill="#53657D" style="fill:#53657D">—</text><text x="1315" y="633" class="h3" text-anchor="middle" fill="#159957" style="fill:#159957">YES</text><rect x="61" y="657" width="1478" height="67" fill="#FFFFFF"/><line x1="61" y1="724" x2="1539" y2="724" stroke="#D7E2F0" stroke-width="1"/><text x="95" y="699" class="body" text-anchor="start" fill="#13233A" style="fill:#13233A">Benchmark CLI + JSON</text><text x="900" y="700" class="h3" text-anchor="middle" fill="#53657D" style="fill:#53657D">—</text><text x="1315" y="700" class="h3" text-anchor="middle" fill="#159957" style="fill:#159957">YES</text><rect x="61" y="724" width="1478" height="67" fill="#F7FAFE"/><line x1="61" y1="791" x2="1539" y2="791" stroke="#D7E2F0" stroke-width="1"/><text x="95" y="766" class="body" text-anchor="start" fill="#13233A" style="fill:#13233A">Notebook, Docker, CI protocol</text><text x="900" y="767" class="h3" text-anchor="middle" fill="#53657D" style="fill:#53657D">—</text><text x="1315" y="767" class="h3" text-anchor="middle" fill="#159957" style="fill:#159957">YES</text><rect x="260" y="840" width="1080" height="44" rx="12" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="2"/><text x="800" y="870" class="small" text-anchor="middle" fill="#FFFFFF" style="fill:#FFFFFF">MatrixLab complements numerical libraries; it does not replace BLAS, LAPACK, NumPy, PyTorch, or cuBLAS.</text></svg>
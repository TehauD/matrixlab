<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Fewer operations do not always mean lower latency</title><desc id="desc">Exploratory evidence contrasts a tenfold arithmetic reduction with slightly slower median timing for the optimized path in a very small workload.</desc>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1769E0"/><stop offset="1" stop-color="#6D4AFF"/></linearGradient>
  <linearGradient id="good" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#159957"/><stop offset="1" stop-color="#22C55E"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B1F3A" flood-opacity="0.12"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#53657D"/></marker>
  <style>
    text { font-family: Inter, Segoe UI, Arial, sans-serif; fill:#13233A; }
    .h1 { font-size:52px; font-weight:800; letter-spacing:-1px; }
    .h2 { font-size:31px; font-weight:750; }
    .h3 { font-size:23px; font-weight:700; }
    .body { font-size:20px; }
    .small { font-size:16px; fill:#53657D; }
    .mono { font-family: Consolas, Menlo, monospace; font-size:20px; }
    .metric { font-size:64px; font-weight:850; }
  </style>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="800" y="75" class="h1" text-anchor="middle" fill="#0B1F3A" style="fill:#0B1F3A">Fewer Operations ≠ Automatically Faster Execution</text><text x="800" y="118" class="h3" text-anchor="middle" fill="#53657D" style="fill:#53657D">Mathematical efficiency and observed latency are related, but not identical.</text><rect x="60" y="165" width="680" height="485" rx="24" fill="#FFFFFF" stroke="#159957" stroke-width="2" filter="url(#shadow)"/><text x="400" y="220" class="h2" text-anchor="middle" fill="#159957" style="fill:#159957">Estimated arithmetic work</text><text x="400" y="320" class="metric" text-anchor="middle" fill="#DC3545" style="fill:#DC3545">75,000</text><text x="400" y="365" class="metric" text-anchor="middle" fill="#53657D" style="fill:#53657D">↓</text><text x="400" y="455" class="metric" text-anchor="middle" fill="#159957" style="fill:#159957">7,500</text><rect x="175" y="515" width="450" height="80" rx="16" fill="#EAF8F0" stroke="#159957" stroke-width="2"/><text x="400" y="566" class="h2" text-anchor="middle" fill="#159957" style="fill:#159957">10× less estimated work</text><rect x="860" y="165" width="680" height="485" rx="24" fill="#FFFFFF" stroke="#F97316" stroke-width="2" filter="url(#shadow)"/><text x="1200" y="220" class="h2" text-anchor="middle" fill="#F97316" style="fill:#F97316">Exploratory median latency</text><text x="1045" y="310" class="h3" text-anchor="middle" fill="#159957" style="fill:#159957">Optimized</text><text x="1355" y="310" class="h3" text-anchor="middle" fill="#1769E0" style="fill:#1769E0">Left-to-right</text><text x="1045" y="405" class="metric" text-anchor="middle" fill="#159957" style="fill:#159957">0.0186</text><text x="1355" y="405" class="metric" text-anchor="middle" fill="#1769E0" style="fill:#1769E0">0.0170</text><text x="1045" y="448" class="h3" text-anchor="middle" fill="#53657D" style="fill:#53657D">ms</text><text x="1355" y="448" class="h3" text-anchor="middle" fill="#53657D" style="fill:#53657D">ms</text><rect x="975" y="515" width="450" height="80" rx="16" fill="#FFF3E8" stroke="#F97316" stroke-width="2"/><text x="1200" y="550" class="h3" text-anchor="middle" fill="#F97316" style="fill:#F97316">No latency gain in this microbenchmark</text><text x="1200" y="580" class="small" text-anchor="middle" fill="#53657D" style="fill:#53657D">10 repeats · one environment · very short durations</text><text x="800" y="710" class="h2" text-anchor="middle" fill="#0B1F3A" style="fill:#0B1F3A">Why the gap?</text><rect x="70" y="748" width="220" height="80" rx="15" fill="#F7FAFE" stroke="#D7E2F0" stroke-width="2"/><text x="180" y="797" class="body" text-anchor="middle" fill="#13233A" style="fill:#13233A">planning + dispatch</text><rect x="325" y="748" width="220" height="80" rx="15" fill="#F7FAFE" stroke="#D7E2F0" stroke-width="2"/><text x="435" y="797" class="body" text-anchor="middle" fill="#13233A" style="fill:#13233A">allocation + layout</text><rect x="580" y="748" width="220" height="80" rx="15" fill="#F7FAFE" stroke="#D7E2F0" stroke-width="2"/><text x="690" y="797" class="body" text-anchor="middle" fill="#13233A" style="fill:#13233A">BLAS kernel choice</text><rect x="835" y="748" width="220" height="80" rx="15" fill="#F7FAFE" stroke="#D7E2F0" stroke-width="2"/><text x="945" y="797" class="body" text-anchor="middle" fill="#13233A" style="fill:#13233A">cache + memory</text><rect x="1090" y="748" width="220" height="80" rx="15" fill="#F7FAFE" stroke="#D7E2F0" stroke-width="2"/><text x="1200" y="797" class="body" text-anchor="middle" fill="#13233A" style="fill:#13233A">timer resolution</text><rect x="1345" y="748" width="220" height="80" rx="15" fill="#F7FAFE" stroke="#D7E2F0" stroke-width="2"/><text x="1455" y="797" class="body" text-anchor="middle" fill="#13233A" style="fill:#13233A">transfer + sync</text><text x="800" y="875" class="small" text-anchor="middle" fill="#53657D" style="fill:#53657D">Exploratory evidence, not a generalized performance claim.</text></svg>
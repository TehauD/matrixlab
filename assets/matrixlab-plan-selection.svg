<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">How MatrixLab chooses a plan</title><desc id="desc">Dynamic programming evaluates binary splits, stores subproblem costs, reconstructs the minimum-cost tree, and caches the plan.</desc>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1769E0"/><stop offset="1" stop-color="#6D4AFF"/></linearGradient>
  <linearGradient id="good" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#159957"/><stop offset="1" stop-color="#22C55E"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B1F3A" flood-opacity="0.12"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#53657D"/></marker>
  <style>
    text { font-family: Inter, Segoe UI, Arial, sans-serif; fill:#13233A; }
    .h1 { font-size:52px; font-weight:800; letter-spacing:-1px; }
    .h2 { font-size:31px; font-weight:750; }
    .h3 { font-size:23px; font-weight:700; }
    .body { font-size:20px; }
    .small { font-size:16px; fill:#53657D; }
    .mono { font-family: Consolas, Menlo, monospace; font-size:20px; }
    .metric { font-size:64px; font-weight:850; }
  </style>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="800" y="75" class="h1" text-anchor="middle" fill="#0B1F3A" style="fill:#0B1F3A">How MatrixLab Chooses the Best Order</text><text x="800" y="116" class="h3" text-anchor="middle" fill="#53657D" style="fill:#53657D">Evaluate subproblems once · Reconstruct the minimum-cost binary tree</text><rect x="55" y="165" width="250" height="610" rx="24" fill="#FFFFFF" stroke="#1769E0" stroke-width="2" filter="url(#shadow)"/><circle cx="103" cy="215" r="25" fill="#1769E0"/><text x="103" y="224" class="h3" text-anchor="middle" fill="#FFFFFF" style="fill:#FFFFFF">1</text><text x="147" y="224" class="h2" text-anchor="start" fill="#1769E0" style="fill:#1769E0">Enumerate splits</text><rect x="550" y="165" width="500" height="610" rx="24" fill="#FFFFFF" stroke="#159957" stroke-width="2" filter="url(#shadow)"/><circle cx="598" cy="215" r="25" fill="#159957"/><text x="598" y="224" class="h3" text-anchor="middle" fill="#FFFFFF" style="fill:#FFFFFF">2</text><text x="642" y="224" class="h2" text-anchor="start" fill="#159957" style="fill:#159957">Solve subproblems</text><rect x="1075" y="165" width="470" height="610" rx="24" fill="#FFFFFF" stroke="#6D4AFF" stroke-width="2" filter="url(#shadow)"/><circle cx="1123" cy="215" r="25" fill="#6D4AFF"/><text x="1123" y="224" class="h3" text-anchor="middle" fill="#FFFFFF" style="fill:#FFFFFF">3</text><text x="1167" y="224" class="h2" text-anchor="start" fill="#6D4AFF" style="fill:#6D4AFF">Select + cache plan</text><text x="180" y="282" class="h3" text-anchor="middle" fill="#13233A" style="fill:#13233A">A₀  A₁  A₂  A₃</text><text x="180" y="335" class="body" text-anchor="middle" fill="#53657D" style="fill:#53657D">5 valid full binary trees</text><circle cx="180" cy="395" r="7" fill="#1769E0"/><line x1="180" y1="402" x2="145" y2="430" stroke="#1769E0" stroke-width="3"/><line x1="180" y1="402" x2="215" y2="430" stroke="#1769E0" stroke-width="3"/><text x="180" y="461" class="small" text-anchor="middle" fill="#53657D" style="fill:#53657D">((A₀A₁)A₂)A₃</text><circle cx="180" cy="475" r="7" fill="#1769E0"/><line x1="180" y1="482" x2="145" y2="510" stroke="#1769E0" stroke-width="3"/><line x1="180" y1="482" x2="215" y2="510" stroke="#1769E0" stroke-width="3"/><text x="180" y="541" class="small" text-anchor="middle" fill="#53657D" style="fill:#53657D">(A₀(A₁A₂))A₃</text><circle cx="180" cy="555" r="7" fill="#1769E0"/><line x1="180" y1="562" x2="145" y2="590" stroke="#1769E0" stroke-width="3"/><line x1="180" y1="562" x2="215" y2="590" stroke="#1769E0" stroke-width="3"/><text x="180" y="621" class="small" text-anchor="middle" fill="#53657D" style="fill:#53657D">A₀((A₁A₂)A₃)</text><circle cx="180" cy="635" r="7" fill="#1769E0"/><line x1="180" y1="642" x2="145" y2="670" stroke="#1769E0" stroke-width="3"/><line x1="180" y1="642" x2="215" y2="670" stroke="#1769E0" stroke-width="3"/><text x="180" y="701" class="small" text-anchor="middle" fill="#53657D" style="fill:#53657D">A₀(A₁(A₂A₃))</text><rect x="615" y="292" width="62" height="62" fill="#EAF8F0" stroke="#D7E2F0"/><text x="646" y="331" class="h3" text-anchor="middle" fill="#159957" style="fill:#159957">0</text><rect x="677" y="292" width="62" height="62" fill="#EAF8F0" stroke="#D7E2F0"/><text x="708" y="330" class="small" text-anchor="middle" fill="#159957" style="fill:#159957">min</text><rect x="739" y="292" width="62" height="62" fill="#EAF8F0" stroke="#D7E2F0"/><text x="770" y="330" class="small" text-anchor="middle" fill="#159957" style="fill:#159957">min</text><rect x="801" y="292" width="62" height="62" fill="#EAF8F0" stroke="#D7E2F0"/><text x="832" y="330" class="small" text-anchor="middle" fill="#159957" style="fill:#159957">min</text><rect x="615" y="354" width="62" height="62" fill="#F2F5F9" stroke="#D7E2F0"/><rect x="677" y="354" width="62" height="62" fill="#EAF8F0" stroke="#D7E2F0"/><text x="708" y="393" class="h3" text-anchor="middle" fill="#159957" style="fill:#159957">0</text><rect x="739" y="354" width="62" height="62" fill="#EAF8F0" stroke="#D7E2F0"/><text x="770" y="392" class="small" text-anchor="middle" fill="#159957" style="fill:#159957">min</text><rect x="801" y="354" width="62" height="62" fill="#EAF8F0" stroke="#D7E2F0"/><text x="832" y="392" class="small" text-anchor="middle" fill="#159957" style="fill:#159957">min</text><rect x="615" y="416" width="62" height="62" fill="#F2F5F9" stroke="#D7E2F0"/><rect x="677" y="416" width="62" height="62" fill="#F2F5F9" stroke="#D7E2F0"/><rect x="739" y="416" width="62" height="62" fill="#EAF8F0" stroke="#D7E2F0"/><text x="770" y="455" class="h3" text-anchor="middle" fill="#159957" style="fill:#159957">0</text><rect x="801" y="416" width="62" height="62" fill="#EAF8F0" stroke="#D7E2F0"/><text x="832" y="454" class="small" text-anchor="middle" fill="#159957" style="fill:#159957">min</text><rect x="615" y="478" width="62" height="62" fill="#F2F5F9" stroke="#D7E2F0"/><rect x="677" y="478" width="62" height="62" fill="#F2F5F9" stroke="#D7E2F0"/><rect x="739" y="478" width="62" height="62" fill="#F2F5F9" stroke="#D7E2F0"/><rect x="801" y="478" width="62" height="62" fill="#EAF8F0" stroke="#D7E2F0"/><text x="832" y="517" class="h3" text-anchor="middle" fill="#159957" style="fill:#159957">0</text><text x="800" y="270" class="h3" text-anchor="middle" fill="#159957" style="fill:#159957">DP cost table</text><rect x="610" y="585" width="380" height="120" rx="16" fill="#EAF8F0" stroke="#159957" stroke-width="2"/><text x="800" y="625" class="h3" text-anchor="middle" fill="#13233A" style="fill:#13233A">cost[i,j] = min over k</text><text x="800" y="665" class="small" text-anchor="middle" fill="#53657D" style="fill:#53657D">left cost + right cost + multiply cost</text><text x="1310" y="280" class="h3" text-anchor="middle" fill="#6D4AFF" style="fill:#6D4AFF">Minimum-cost plan</text><circle cx="1310" cy="350" r="12" fill="#6D4AFF"/><line x1="1310" y1="362" x2="1215" y2="430" stroke="#6D4AFF" stroke-width="5"/><line x1="1310" y1="362" x2="1405" y2="430" stroke="#6D4AFF" stroke-width="5"/><circle cx="1215" cy="430" r="10" fill="#6D4AFF"/><circle cx="1405" cy="430" r="10" fill="#6D4AFF"/><line x1="1215" y1="440" x2="1165" y2="500" stroke="#6D4AFF" stroke-width="4"/><line x1="1215" y1="440" x2="1265" y2="500" stroke="#6D4AFF" stroke-width="4"/><line x1="1405" y1="440" x2="1355" y2="500" stroke="#6D4AFF" stroke-width="4"/><line x1="1405" y1="440" x2="1455" y2="500" stroke="#6D4AFF" stroke-width="4"/><text x="1165" y="535" class="h3" text-anchor="middle" fill="#13233A" style="fill:#13233A">A₀</text><text x="1265" y="535" class="h3" text-anchor="middle" fill="#13233A" style="fill:#13233A">A₁</text><text x="1355" y="535" class="h3" text-anchor="middle" fill="#13233A" style="fill:#13233A">A₂</text><text x="1455" y="535" class="h3" text-anchor="middle" fill="#13233A" style="fill:#13233A">A₃</text><rect x="1130" y="600" width="360" height="105" rx="16" fill="#F0EDFF" stroke="#6D4AFF" stroke-width="2"/><text x="1310" y="640" class="h3" text-anchor="middle" fill="#6D4AFF" style="fill:#6D4AFF">Shape-keyed LRU cache</text><text x="1310" y="675" class="small" text-anchor="middle" fill="#53657D" style="fill:#53657D">Reuse plan for repeated dimensions</text><line x1="495" y1="470" x2="535" y2="470" stroke="#53657D" stroke-width="4" marker-end="url(#arrow)"/><line x1="1050" y1="470" x2="1065" y2="470" stroke="#53657D" stroke-width="4" marker-end="url(#arrow)"/><text x="800" y="840" class="h2" text-anchor="middle" fill="#0B1F3A" style="fill:#0B1F3A">Exact for scalar-count cost · O(n³) planning time · O(n²) planning space</text></svg>
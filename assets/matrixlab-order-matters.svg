<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Why multiplication order matters</title><desc id="desc">Two valid parenthesizations produce the same result but require 7,500 versus 75,000 scalar multiplications.</desc>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1769E0"/><stop offset="1" stop-color="#6D4AFF"/></linearGradient>
  <linearGradient id="good" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#159957"/><stop offset="1" stop-color="#22C55E"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B1F3A" flood-opacity="0.12"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#53657D"/></marker>
  <style>
    text { font-family: Inter, Segoe UI, Arial, sans-serif; fill:#13233A; }
    .h1 { font-size:52px; font-weight:800; letter-spacing:-1px; }
    .h2 { font-size:31px; font-weight:750; }
    .h3 { font-size:23px; font-weight:700; }
    .body { font-size:20px; }
    .small { font-size:16px; fill:#53657D; }
    .mono { font-family: Consolas, Menlo, monospace; font-size:20px; }
    .metric { font-size:64px; font-weight:850; }
  </style>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="800" y="78" class="h1" text-anchor="middle" fill="#0B1F3A" style="fill:#0B1F3A">Same Matrices. Different Order. 10× Different Work.</text><text x="800" y="120" class="h3" text-anchor="middle" fill="#53657D" style="fill:#53657D">A₀ 10×100   ·   A₁ 100×5   ·   A₂ 5×50</text><rect x="70" y="165" width="700" height="565" rx="26" fill="#FFFFFF" stroke="#159957" stroke-width="2" filter="url(#shadow)"/><text x="420" y="220" class="h2" text-anchor="middle" fill="#159957" style="fill:#159957">Optimal parenthesization</text><rect x="830" y="165" width="700" height="565" rx="26" fill="#FFFFFF" stroke="#DC3545" stroke-width="2" filter="url(#shadow)"/><text x="1180" y="220" class="h2" text-anchor="middle" fill="#DC3545" style="fill:#DC3545">Alternative parenthesization</text><text x="420" y="288" class="h1" text-anchor="middle" fill="#159957" style="fill:#159957">(A₀ × A₁) × A₂</text><rect x="135" y="340" width="570" height="90" rx="16" fill="#EAF8F0" stroke="#159957" stroke-width="2"/><text x="420" y="378" class="h3" text-anchor="middle" fill="#13233A" style="fill:#13233A">10×100×5 = 5,000</text><text x="420" y="408" class="small" text-anchor="middle" fill="#53657D" style="fill:#53657D">intermediate: 10×5</text><rect x="135" y="455" width="570" height="90" rx="16" fill="#EAF8F0" stroke="#159957" stroke-width="2"/><text x="420" y="493" class="h3" text-anchor="middle" fill="#13233A" style="fill:#13233A">10×5×50 = 2,500</text><text x="420" y="523" class="small" text-anchor="middle" fill="#53657D" style="fill:#53657D">result: 10×50</text><text x="420" y="627" class="metric" text-anchor="middle" fill="#159957" style="fill:#159957">7,500</text><text x="420" y="674" class="h3" text-anchor="middle" fill="#159957" style="fill:#159957">scalar multiplications</text><text x="1180" y="288" class="h1" text-anchor="middle" fill="#DC3545" style="fill:#DC3545">A₀ × (A₁ × A₂)</text><rect x="895" y="340" width="570" height="90" rx="16" fill="#FDEEEF" stroke="#DC3545" stroke-width="2"/><text x="1180" y="378" class="h3" text-anchor="middle" fill="#13233A" style="fill:#13233A">100×5×50 = 25,000</text><text x="1180" y="408" class="small" text-anchor="middle" fill="#53657D" style="fill:#53657D">intermediate: 100×50</text><rect x="895" y="455" width="570" height="90" rx="16" fill="#FDEEEF" stroke="#DC3545" stroke-width="2"/><text x="1180" y="493" class="h3" text-anchor="middle" fill="#13233A" style="fill:#13233A">10×100×50 = 50,000</text><text x="1180" y="523" class="small" text-anchor="middle" fill="#53657D" style="fill:#53657D">result: 10×50</text><text x="1180" y="627" class="metric" text-anchor="middle" fill="#DC3545" style="fill:#DC3545">75,000</text><text x="1180" y="674" class="h3" text-anchor="middle" fill="#DC3545" style="fill:#DC3545">scalar multiplications</text><rect x="350" y="770" width="900" height="85" rx="18" fill="#0B1F3A" stroke="#0B1F3A" stroke-width="2"/><text x="800" y="823" class="h2" text-anchor="middle" fill="#FFFFFF" style="fill:#FFFFFF">67,500 fewer operations · 90% less estimated arithmetic work</text></svg>
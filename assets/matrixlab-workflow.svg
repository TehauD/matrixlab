<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430" role="img" aria-labelledby="title desc">
<title id="title">MatrixLab end-to-end workflow</title><desc id="desc">Compatible matrices flow through validation, planning, caching, backend execution, validation, and evidence capture.</desc>
<defs>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1769E0"/><stop offset="1" stop-color="#6D4AFF"/></linearGradient>
  <linearGradient id="good" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#159957"/><stop offset="1" stop-color="#22C55E"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0B1F3A" flood-opacity="0.12"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#53657D"/></marker>
  <style>
    text { font-family: Inter, Segoe UI, Arial, sans-serif; fill:#13233A; }
    .h1 { font-size:52px; font-weight:800; letter-spacing:-1px; }
    .h2 { font-size:31px; font-weight:750; }
    .h3 { font-size:23px; font-weight:700; }
    .body { font-size:20px; }
    .small { font-size:16px; fill:#53657D; }
    .mono { font-family: Consolas, Menlo, monospace; font-size:20px; }
    .metric { font-size:64px; font-weight:850; }
  </style>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<rect width="1600" height="430" fill="#F7FAFE"/><text x="800" y="65" class="h1" text-anchor="middle" fill="#0B1F3A" style="fill:#0B1F3A">MatrixLab End-to-End Workflow</text><rect x="45" y="125" width="220" height="205" rx="22" fill="#FFFFFF" stroke="#1769E0" stroke-width="2" filter="url(#shadow)"/><circle cx="155" cy="170" r="26" fill="#1769E0"/><text x="155" y="179" class="h3" text-anchor="middle" fill="#FFFFFF" style="fill:#FFFFFF">1</text><text x="155" y="235" class="h2" text-anchor="middle" fill="#1769E0" style="fill:#1769E0">Matrices</text><text x="155" y="275" class="small" text-anchor="middle" fill="#53657D" style="fill:#53657D">compatible chain</text><line x1="265" y1="228" x2="297" y2="228" stroke="#53657D" stroke-width="3" marker-end="url(#arrow)"/><rect x="305" y="125" width="220" height="205" rx="22" fill="#FFFFFF" stroke="#159957" stroke-width="2" filter="url(#shadow)"/><circle cx="415" cy="170" r="26" fill="#159957"/><text x="415" y="179" class="h3" text-anchor="middle" fill="#FFFFFF" style="fill:#FFFFFF">2</text><text x="415" y="235" class="h2" text-anchor="middle" fill="#159957" style="fill:#159957">Plan</text><text x="415" y="275" class="small" text-anchor="middle" fill="#53657D" style="fill:#53657D">exact DP</text><line x1="525" y1="228" x2="557" y2="228" stroke="#53657D" stroke-width="3" marker-end="url(#arrow)"/><rect x="565" y="125" width="220" height="205" rx="22" fill="#FFFFFF" stroke="#6D4AFF" stroke-width="2" filter="url(#shadow)"/><circle cx="675" cy="170" r="26" fill="#6D4AFF"/><text x="675" y="179" class="h3" text-anchor="middle" fill="#FFFFFF" style="fill:#FFFFFF">3</text><text x="675" y="235" class="h2" text-anchor="middle" fill="#6D4AFF" style="fill:#6D4AFF">Cache</text><text x="675" y="275" class="small" text-anchor="middle" fill="#53657D" style="fill:#53657D">shape-keyed LRU</text><line x1="785" y1="228" x2="817" y2="228" stroke="#53657D" stroke-width="3" marker-end="url(#arrow)"/><rect x="825" y="125" width="220" height="205" rx="22" fill="#FFFFFF" stroke="#F97316" stroke-width="2" filter="url(#shadow)"/><circle cx="935" cy="170" r="26" fill="#F97316"/><text x="935" y="179" class="h3" text-anchor="middle" fill="#FFFFFF" style="fill:#FFFFFF">4</text><text x="935" y="235" class="h2" text-anchor="middle" fill="#F97316" style="fill:#F97316">Execute</text><text x="935" y="275" class="small" text-anchor="middle" fill="#53657D" style="fill:#53657D">NumPy / PyTorch</text><line x1="1045" y1="228" x2="1077" y2="228" stroke="#53657D" stroke-width="3" marker-end="url(#arrow)"/><rect x="1085" y="125" width="220" height="205" rx="22" fill="#FFFFFF" stroke="#1769E0" stroke-width="2" filter="url(#shadow)"/><circle cx="1195" cy="170" r="26" fill="#1769E0"/><text x="1195" y="179" class="h3" text-anchor="middle" fill="#FFFFFF" style="fill:#FFFFFF">5</text><text x="1195" y="235" class="h2" text-anchor="middle" fill="#1769E0" style="fill:#1769E0">Validate</text><text x="1195" y="275" class="small" text-anchor="middle" fill="#53657D" style="fill:#53657D">numerical checks</text><line x1="1305" y1="228" x2="1337" y2="228" stroke="#53657D" stroke-width="3" marker-end="url(#arrow)"/><rect x="1345" y="125" width="220" height="205" rx="22" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="2" filter="url(#shadow)"/><circle cx="1455" cy="170" r="26" fill="#0B1F3A"/><text x="1455" y="179" class="h3" text-anchor="middle" fill="#FFFFFF" style="fill:#FFFFFF">6</text><text x="1455" y="235" class="h2" text-anchor="middle" fill="#0B1F3A" style="fill:#0B1F3A">Evidence</text><text x="1455" y="275" class="small" text-anchor="middle" fill="#53657D" style="fill:#53657D">JSON + metadata</text><text x="800" y="385" class="h2" text-anchor="middle" fill="#0B1F3A" style="fill:#0B1F3A">Plan → reuse → execute → verify → preserve the evidence</text></svg>